<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>درجاتي</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#12365f,#2472b8);color:#fff;padding:24px 5%;display:flex;justify-content:space-between;gap:15px}
main{width:min(1200px,94%);margin:24px auto}.panel{background:#fff;padding:20px;border-radius:18px;box-shadow:0 8px 28px #0000000c;margin-bottom:18px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e0ea;border-radius:10px;margin:5px 0 12px}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#1e5fa8;color:#fff}.danger{background:#b42318;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tab{background:#fff}.tab.on{background:#1e5fa8;color:#fff}
.section{display:none}.section.on{display:block}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:center}th{background:#f5f8fc}
.exam{background:linear-gradient(135deg,#102e56,#1f6eb5);color:#fff;border-radius:18px;padding:24px;text-align:center;margin:12px 0}.count{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.box{background:#ffffff20;padding:9px 14px;border-radius:12px;min-width:70px}.box b{display:block;font-size:23px}.notice{padding:14px;background:#fff9e8;border-right:5px solid #d69e2e;border-radius:10px;margin:9px 0}
@media(max-width:750px){.grid{grid-template-columns:1fr}header{flex-direction:column}}
</style></head><body>
<header><div><h1 style="margin:0">درجاتي</h1><div>نظام متابعة الطلبة — اللغة الإنجليزية</div></div><div id="mode"></div></header>
<main>
<div id="login" class="panel" style="max-width:500px;margin:50px auto">
<h2>دخول الأستاذ</h2><label>اسم المستخدم</label><input id="u" value="admin"><label>كلمة المرور</label><input id="pw" type="password" value="123456"><button class="primary" onclick="login()">دخول</button><p id="err"></p>
<hr><h3>دخول الطالب / ولي الأمر</h3><label>الرقم السري المكون من 3 أرقام</label><input id="code" maxlength="3" inputmode="numeric"><button class="primary" onclick="portal()">عرض بيانات الطالب</button>
</div>

<div id="teacher" style="display:none">
<div class="tabs"><button class="tab on" onclick="tab('students',this)">الطلاب</button><button class="tab" onclick="tab('grades',this)">الدرجات</button><button class="tab" onclick="tab('attendance',this)">الحضور</button><button class="tab" onclick="tab('exams',this)">الامتحانات</button><button class="tab" onclick="tab('notices',this)">التبليغات</button><button class="tab" onclick="logout()">خروج</button></div>
<section id="students" class="section on"><div class="grid"><div class="panel"><h2>إضافة طالب</h2><input id="sn" placeholder="الاسم الثلاثي"><select id="sc"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option></select><button class="primary" onclick="addStudent()">إضافة وتوليد الرقم السري</button></div><div class="panel"><h2>الطلاب</h2><div id="studentsList"></div></div></div></section>
<section id="grades" class="section"><div class="panel"><h2>درجات اللغة الإنجليزية</h2><div class="table"><table><thead><tr><th>الطالب</th><th>ش1 ف1</th><th>ش2 ف1</th><th>سعي ف1</th><th>نصف السنة</th><th>ش1 ف2</th><th>ش2 ف2</th><th>سعي ف2</th><th>السعي السنوي</th><th>حفظ</th></tr></thead><tbody id="gradesList"></tbody></table></div></div></section>
<section id="attendance" class="section"><div class="panel"><h2>الحضور</h2><input type="date" id="ad"><div id="attList"></div><button class="primary" onclick="saveAtt()">حفظ الحضور</button></div></section>
<section id="exams" class="section"><div class="panel"><h2>إضافة موعد امتحان</h2><select id="ec"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option></select><select id="et"><option>امتحان الشهر الأول</option><option>امتحان الشهر الثاني</option><option>نصف السنة</option><option>امتحان الشهر الأول — الفصل الثاني</option><option>امتحان الشهر الثاني — الفصل الثاني</option></select><input id="ed" type="date"><input id="etime" type="time"><textarea id="en" placeholder="ملاحظات"></textarea><button class="primary" onclick="addExam()">حفظ الموعد</button></div><div class="panel"><div id="examsList"></div></div></section>
<section id="notices" class="section"><div class="panel"><h2>📢 لوحة التبليغات</h2><select id="nc"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option><option>جميع الصفوف</option></select><select id="nt"><option>تبليغ عام</option><option>الحضور</option><option>تغيير موعد الامتحان</option><option>واجب</option><option>ملاحظة مهمة</option><option>إعلان</option></select><input id="ntitle" placeholder="عنوان التبليغ"><textarea id="nbody" rows="4" placeholder="نص التبليغ"></textarea><button class="primary" onclick="addNotice()">نشر التبليغ</button></div><div class="panel"><div id="noticesList"></div></div></section>
</div>

<div id="portalView" style="display:none"></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('pw').value})});$('login').style.display='none';$('teacher').style.display='block';$('mode').textContent='لوحة الأستاذ';loadAll()}catch(e){$('err').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function addStudent(){let j=await api('/api/students',{method:'POST',body:JSON.stringify({name:$('sn').value,class_name:$('sc').value})});alert('تمت الإضافة. الرقم السري: '+j.code);$('sn').value='';loadStudents()}
async function addStudent(){
  const name=$('sn').value.trim();
  const cls=$('sc').value;
  const btn=document.querySelector('#students button.primary');

  if(!name){
    alert('يرجى كتابة الاسم الثلاثي أولاً');
    $('sn').focus();
    return;
  }

  try{
    if(btn) btn.disabled=true;

    const j=await api('/api/students',{
      method:'POST',
      body:JSON.stringify({
        name:name,
        class_name:cls
      })
    });

    alert(
      'تمت إضافة الطالب بنجاح ✅\n\n' +
      'الاسم: '+j.name+'\n' +
      'الصف: '+j.class_name+'\n' +
      'الرقم السري: '+j.code
    );

    $('sn').value='';
    await loadStudents();

  }catch(e){
    alert('تعذر إضافة الطالب ❌\n\n'+e.message);
  }finally{
    if(btn) btn.disabled=false;
  }
}{let a=await api('/api/students');$('studentsList').innerHTML='<div class="table"><table><tr><th>الاسم</th><th>الصف</th><th>الرقم السري</th><th></th></tr>'+a.map(s=>`<tr><td>${s.name}</td><td>${s.class_name}</td><td><b>${s.code}</b></td><td><button class="danger" onclick="delStudent(${s.id})">حذف</button></td></tr>`).join('')+'</table></div>'}
async function delStudent(id){if(confirm('حذف الطالب؟')){await api('/api/students/'+id,{method:'DELETE'});loadAll()}}
async function loadGrades(){let a=await api('/api/grades');$('gradesList').innerHTML=a.map(s=>`<tr><td>${s.name}</td>${['m1_t1','m2_t1'].map(k=>`<td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}${k}" value="${s[k]??''}"></td>`).join('')}<td>${s.f1??'—'}</td><td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}midyear" value="${s.midyear??''}"></td>${['m1_t2','m2_t2'].map(k=>`<td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}${k}" value="${s[k]??''}"></td>`).join('')}<td>${s.f2??'—'}</td><td>${s.annual??'—'}</td><td><button class="primary" onclick="saveGrade(${s.id})">حفظ</button></td></tr>`).join('')}
async function saveGrade(id){let keys=['m1_t1','m2_t1','midyear','m1_t2','m2_t2'];let b={};keys.forEach(k=>b[k]=$('g'+id+k).value===''?null:Number($('g'+id+k).value));await api('/api/grades/'+id,{method:'PUT',body:JSON.stringify(b)});loadGrades();alert('تم حفظ الدرجة')}
async function loadAtt(){let st=await api('/api/students');$('attList').innerHTML='<div class="table"><table><tr><th>الطالب</th><th>الحالة</th></tr>'+st.map(s=>`<tr><td>${s.name}</td><td><select id="a${s.id}"><option>حاضر</option><option>غائب</option><option>مجاز</option></select></td></tr>`).join('')+'</table></div>'}
async function saveAtt(){let st=await api('/api/students');let records=st.map(s=>({student_id:s.id,status:$('a'+s.id).value}));await api('/api/attendance',{method:'POST',body:JSON.stringify({date:$('ad').value,records})});alert('تم حفظ الحضور')}
async function addExam(){await api('/api/exams',{method:'POST',body:JSON.stringify({class_name:$('ec').value,type:$('et').value,date:$('ed').value,time:$('etime').value,note:$('en').value})});$('en').value='';loadExams()}
async function loadExams(){let a=await api('/api/exams');$('examsList').innerHTML=a.map(e=>`<div class="exam"><b>${e.class_name}</b><h2>${e.type} — اللغة الإنجليزية</h2><div>${e.date} ${e.time||''}</div><button class="danger" onclick="delExam(${e.id})">حذف</button></div>`).join('')}
async function delExam(id){await api('/api/exams/'+id,{method:'DELETE'});loadExams()}
async function addNotice(){await api('/api/notices',{method:'POST',body:JSON.stringify({class_name:$('nc').value,type:$('nt').value,title:$('ntitle').value,body:$('nbody').value})});$('ntitle').value='';$('nbody').value='';loadNotices()}
async function loadNotices(){let a=await api('/api/notices');$('noticesList').innerHTML=a.map(n=>`<div class="notice"><b>${n.class_name} — ${n.type}</b><h3>${n.title}</h3><p>${n.body}</p><small>${n.created_at}</small><br><button class="danger" onclick="delNotice(${n.id})">حذف</button></div>`).join('')}
async function delNotice(id){await api('/api/notices/'+id,{method:'DELETE'});loadNotices()}
function countdown(el,target){function t(){let d=target-Date.now();if(d<=0){el.innerHTML='<b>حان موعد الامتحان</b>';return}let x=[Math.floor(d/864e5)];d%=864e5;x.push(Math.floor(d/36e5));d%=36e5;x.push(Math.floor(d/6e4));d%=6e4;x.push(Math.floor(d/1e3));el.innerHTML='<div class="count">'+x.map((v,i)=>`<div class="box"><b>${String(v).padStart(2,'0')}</b><span>${['يوم','ساعة','دقيقة','ثانية'][i]}</span></div>`).join('')+'</div>'}t();setInterval(t,1000)}
async function portal(){try{let j=await api('/api/portal/'+$('code').value.trim());$('login').style.display='none';$('portalView').style.display='block';$('mode').textContent='بوابة الطالب / ولي الأمر';let g=j.grades;let ex=j.exams.map((e,i)=>{let id='c'+i;setTimeout(()=>countdown($(id),new Date(e.date+'T'+(e.time||'00:00')+':00').getTime()),0);return `<div class="exam"><div>${e.date} ${e.time||''}</div><h2>${e.type} — اللغة الإنجليزية</h2><div id="${id}"></div></div>`}).join('');let no=j.notices.map(n=>`<div class="notice"><b>${n.type}</b><h3>${n.title}</h3><p>${n.body}</p></div>`).join('')||'<p>لا توجد تبليغات.</p>';$('portalView').innerHTML=`<div class="panel"><h1>${j.student.name}</h1><p>الصف: <b>${j.student.class_name}</b></p><h2>📅 مواعيد الامتحانات</h2>${ex||'<p>لا توجد مواعيد.</p>'}<h2>📢 التبليغات</h2>${no}<h2>📊 الدرجات</h2><div class="table"><table><tr><th>ش1 ف1</th><th>ش2 ف1</th><th>سعي ف1</th><th>نصف السنة</th><th>ش1 ف2</th><th>ش2 ف2</th><th>سعي ف2</th><th>السعي السنوي</th></tr><tr>${[g.m1_t1,g.m2_t1,g.f1,g.midyear,g.m1_t2,g.m2_t2,g.f2,g.annual].map(v=>`<td>${v??'—'}</td>`).join('')}</tr></table></div><h2>📝 الحضور</h2>${j.attendance.map(a=>`<p>${a.date}: <b>${a.status}</b></p>`).join('')||'<p>لا توجد سجلات.</p>'}<div class="notice">🔒 مشاهدة فقط — لا يمكن للطالب أو ولي الأمر تعديل أي بيانات.</div></div>`}catch(e){alert(e.message)}}
async function loadAll(){loadStudents();loadGrades();loadAtt();loadExams();loadNotices();$('ad').value=new Date().toISOString().slice(0,10)}
</script></body></html>
