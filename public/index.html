<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>درجاتي</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#12365f,#2472b8);color:#fff;padding:24px 5%;display:flex;justify-content:space-between;gap:15px}
main{width:min(1200px,94%);margin:24px auto}.panel{background:#fff;padding:20px;border-radius:18px;box-shadow:0 8px 28px #0000000c;margin-bottom:18px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e0ea;border-radius:10px;margin:5px 0 12px}
button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#1e5fa8;color:#fff}.danger{background:#b42318;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tab{background:#fff}.tab.on{background:#1e5fa8;color:#fff}
.section{display:none}.section.on{display:block}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:center}th{background:#f5f8fc}
.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}.class-card{background:#f5f8fc;border:2px solid #e1e8f0;border-radius:16px;padding:20px;text-align:center;cursor:pointer;font-weight:800;font-size:20px;transition:.2s}.class-card:hover{border-color:#1e5fa8;transform:translateY(-2px)}.class-card.active{background:#1e5fa8;color:#fff;border-color:#1e5fa8}.back-btn{background:#eef4fb;color:#1e5fa8;margin-bottom:14px}.exam{background:linear-gradient(135deg,#102e56,#1f6eb5);color:#fff;border-radius:18px;padding:24px;text-align:center;margin:12px 0}.count{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.box{background:#ffffff20;padding:9px 14px;border-radius:12px;min-width:70px}.box b{display:block;font-size:23px}.notice{padding:14px;background:#fff9e8;border-right:5px solid #d69e2e;border-radius:10px;margin:9px 0}
.grade-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:15px}.grade-card{border-radius:18px;padding:18px;text-align:center;box-shadow:0 5px 18px #0000000a;border:2px solid transparent}.grade-card .label{font-size:18px;font-weight:700;margin-bottom:8px}.grade-card .value{font-size:30px;font-weight:900}.monthly{background:#eaf3ff;border-color:#b9d5f5;color:#174a7c}.midyear{background:#f1e9ff;border-color:#d7bff5;color:#63359b}.semester{background:#fff1dc;border-color:#f3c98b;color:#8a4d00}.annual-pass{background:#e5f8ea;border-color:#8bd39b;color:#19713a}.annual-fail{background:#ffe8e8;border-color:#f0a0a0;color:#b42318}.annual-equal{background:#fff7d6;border-color:#ead37b;color:#7a5a00}
@media(max-width:750px){.grid{grid-template-columns:1fr}.class-grid{grid-template-columns:1fr}.grade-cards{grid-template-columns:repeat(2,1fr)}header{flex-direction:column}}
@media(max-width:430px){.grade-cards{grid-template-columns:1fr 1fr}.grade-card{padding:14px 8px}.grade-card .label{font-size:15px}.grade-card .value{font-size:25px}}
</style></head><body>
<header><div><h1 style="margin:0">درجاتي</h1><div>نظام متابعة الطلبة — اللغة الإنجليزية</div></div><div id="mode"></div></header>
<main>
<div id="login" class="panel" style="max-width:500px;margin:50px auto">
<h2>دخول الأستاذ</h2><label>اسم المستخدم</label><input id="u" autocomplete="username" placeholder="اكتب اسم المستخدم"><label>الرمز السري</label><input id="pw" type="password" autocomplete="current-password" placeholder="اكتب الرمز السري"><button class="primary" onclick="login()">دخول</button><p id="err"></p>
<hr><h3>دخول الطالب / ولي الأمر</h3><label>الرقم السري المكون من 3 أرقام</label><input id="code" maxlength="3" inputmode="numeric"><button class="primary" onclick="portal()">عرض بيانات الطالب</button>
</div>

<div id="teacher" style="display:none">
<div class="tabs"><button class="tab on" onclick="tab('students',this)">الطلاب</button><button class="tab" onclick="tab('grades',this)">الدرجات</button><button class="tab" onclick="tab('attendance',this)">الحضور</button><button class="tab" onclick="tab('exams',this)">الامتحانات</button><button class="tab" onclick="tab('notices',this)">التبليغات</button><button class="tab" onclick="logout()">خروج</button></div>
<section id="students" class="section on"><div class="grid"><div class="panel"><h2>إضافة طالب</h2><input id="sn" placeholder="الاسم الثلاثي"><select id="sc"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option></select><button class="primary" onclick="addStudent()">إضافة وتوليد الرقم السري</button></div><div class="panel"><h2>الطلاب</h2><div id="studentsList"></div></div></div></section>
<section id="grades" class="section">
<div class="panel">
  <h2>📊 درجات اللغة الإنجليزية</h2>
  <p>اختر الصف لعرض أسماء طلابه وإضافة الدرجات لهم.</p>
  <div id="classSelector" class="class-grid"></div>
</div>
<div id="classGradesPanel" class="panel" style="display:none">
  <button class="back-btn" onclick="showClassSelector()">↩ العودة إلى الصفوف</button>
  <h2 id="selectedClassTitle"></h2>
  <div class="table"><table><thead><tr>
    <th>الطالب</th><th>ش1 ف1</th><th>ش2 ف1</th><th>سعي ف1</th><th>نصف السنة</th>
    <th>ش1 ف2</th><th>ش2 ف2</th><th>سعي ف2</th><th>السعي السنوي</th><th>حفظ</th>
  </tr></thead><tbody id="gradesList"></tbody></table></div>
</div>
</section>
<section id="attendance" class="section"><div class="panel"><h2>الحضور</h2><input type="date" id="ad"><div id="attList"></div><button class="primary" onclick="saveAtt()">حفظ الحضور</button></div></section>
<section id="exams" class="section"><div class="panel"><h2>إضافة موعد امتحان</h2><select id="ec"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option></select><select id="et"><option>امتحان الشهر الأول</option><option>امتحان الشهر الثاني</option><option>نصف السنة</option><option>امتحان الشهر الأول — الفصل الثاني</option><option>امتحان الشهر الثاني — الفصل الثاني</option></select><input id="ed" type="date"><input id="etime" type="time"><textarea id="en" placeholder="ملاحظات"></textarea><button class="primary" onclick="addExam()">حفظ الموعد</button></div><div class="panel"><div id="examsList"></div></div></section>
<section id="notices" class="section"><div class="panel"><h2>📢 لوحة التبليغات</h2><select id="nc"><option>الثالث المتوسط</option><option>الرابع العلمي</option><option>الخامس العلمي</option><option>السادس العلمي</option><option>جميع الصفوف</option></select><select id="nt"><option>تبليغ عام</option><option>الحضور</option><option>تغيير موعد الامتحان</option><option>واجب</option><option>ملاحظة مهمة</option><option>إعلان</option></select><input id="ntitle" placeholder="عنوان التبليغ"><textarea id="nbody" rows="4" placeholder="نص التبليغ"></textarea><button class="primary" onclick="addNotice()">نشر التبليغ</button></div><div class="panel"><div id="noticesList"></div></div></section>
</div>

<div id="portalView" style="display:none"></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('pw').value})});$('login').style.display='none';$('teacher').style.display='block';$('mode').textContent='لوحة الأستاذ';loadAll()}catch(e){$('err').textContent=e.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function addStudent(){
  const name=$('sn').value.trim();
  const class_name=$('sc').value;
  if(!name){alert('يرجى كتابة اسم الطالب الثلاثي');$('sn').focus();return;}
  try{
    const j=await api('/api/students',{method:'POST',body:JSON.stringify({name,class_name})});
    alert('تمت إضافة الطالب بنجاح. الرقم السري: '+j.code);
    $('sn').value='';
    await loadStudents();
    await loadGrades();
    await loadAtt();
  }catch(e){alert(e.message)}
}
async function loadStudents(){let a=await api('/api/students');$('studentsList').innerHTML='<div class="table"><table><tr><th>الاسم</th><th>الصف</th><th>الرقم السري</th><th></th></tr>'+a.map(s=>`<tr><td>${s.name}</td><td>${s.class_name}</td><td><b>${s.code}</b></td><td><button class="danger" onclick="delStudent(${s.id})">حذف</button></td></tr>`).join('')+'</table></div>'}
async function delStudent(id){if(confirm('حذف الطالب؟')){await api('/api/students/'+id,{method:'DELETE'});loadAll()}}
let allGrades=[];
let selectedClass='';

const classes=['الثالث المتوسط','الرابع العلمي','الخامس العلمي','السادس العلمي'];

function renderClassSelector(){
  $('classSelector').innerHTML=classes.map(c=>`
    <div class="class-card ${selectedClass===c?'active':''}" onclick="openClassGrades('${c}')">
      ${c}
      <div style="font-size:14px;font-weight:500;margin-top:8px">اضغط لعرض الطلاب والدرجات</div>
    </div>
  `).join('');
}

async function loadGrades(){
  allGrades=await api('/api/grades');
  renderClassSelector();
  if(selectedClass) renderClassGrades();
}

function showClassSelector(){
  selectedClass='';
  $('classGradesPanel').style.display='none';
  $('classSelector').parentElement.style.display='block';
  renderClassSelector();
}

function openClassGrades(cls){
  selectedClass=cls;
  $('classSelector').parentElement.style.display='none';
  $('classGradesPanel').style.display='block';
  $('selectedClassTitle').textContent='درجات — '+cls;
  renderClassGrades();
}

function renderClassGrades(){
  const a=allGrades.filter(s=>s.class_name===selectedClass);
  if(!a.length){
    $('gradesList').innerHTML='<tr><td colspan="10" style="padding:30px">لا يوجد طلاب في هذا الصف حاليًا.</td></tr>';
    return;
  }
  $('gradesList').innerHTML=a.map(s=>`
    <tr>
      <td><b>${s.name}</b></td>
      ${['m1_t1','m2_t1'].map(k=>`<td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}${k}" value="${s[k]??''}"></td>`).join('')}
      <td>${s.f1??'—'}</td>
      <td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}midyear" value="${s.midyear??''}"></td>
      ${['m1_t2','m2_t2'].map(k=>`<td><input style="width:65px" type="number" min="0" max="100" id="g${s.id}${k}" value="${s[k]??''}"></td>`).join('')}
      <td>${s.f2??'—'}</td>
      <td>${s.annual??'—'}</td>
      <td><button class="primary" onclick="saveGrade(${s.id})">حفظ</button></td>
    </tr>
  `).join('');
}
async function saveGrade(id){let keys=['m1_t1','m2_t1','midyear','m1_t2','m2_t2'];let b={};keys.forEach(k=>b[k]=$('g'+id+k).value===''?null:Number($('g'+id+k).value));await api('/api/grades/'+id,{method:'PUT',body:JSON.stringify(b)});allGrades=await api('/api/grades');renderClassGrades();alert('تم حفظ الدرجة')}
async function loadAtt(){let st=await api('/api/students');$('attList').innerHTML='<div class="table"><table><tr><th>الطالب</th><th>الحالة</th></tr>'+st.map(s=>`<tr><td>${s.name}</td><td><select id="a${s.id}"><option>حاضر</option><option>غائب</option><option>مجاز</option></select></td></tr>`).join('')+'</table></div>'}
async function saveAtt(){let st=await api('/api/students');let records=st.map(s=>({student_id:s.id,status:$('a'+s.id).value}));await api('/api/attendance',{method:'POST',body:JSON.stringify({date:$('ad').value,records})});alert('تم حفظ الحضور')}
async function addExam(){await api('/api/exams',{method:'POST',body:JSON.stringify({class_name:$('ec').value,type:$('et').value,date:$('ed').value,time:$('etime').value,note:$('en').value})});$('en').value='';loadExams()}
async function loadExams(){let a=await api('/api/exams');$('examsList').innerHTML=a.map(e=>`<div class="exam"><b>${e.class_name}</b><h2>${e.type} — اللغة الإنجليزية</h2><div>${e.date} ${e.time||''}</div><button class="danger" onclick="delExam(${e.id})">حذف</button></div>`).join('')}
async function delExam(id){await api('/api/exams/'+id,{method:'DELETE'});loadExams()}
async function addNotice(){await api('/api/notices',{method:'POST',body:JSON.stringify({class_name:$('nc').value,type:$('nt').value,title:$('ntitle').value,body:$('nbody').value})});$('ntitle').value='';$('nbody').value='';loadNotices()}
async function loadNotices(){let a=await api('/api/notices');$('noticesList').innerHTML=a.map(n=>`<div class="notice"><b>${n.class_name} — ${n.type}</b><h3>${n.title}</h3><p>${n.body}</p><small>${n.created_at}</small><br><button class="danger" onclick="delNotice(${n.id})">حذف</button></div>`).join('')}
async function delNotice(id){await api('/api/notices/'+id,{method:'DELETE'});loadNotices()}
function countdown(el,target){function t(){let d=target-Date.now();if(d<=0){el.innerHTML='<b>حان موعد الامتحان</b>';return}let x=[Math.floor(d/864e5)];d%=864e5;x.push(Math.floor(d/36e5));d%=36e5;x.push(Math.floor(d/6e4));d%=6e4;x.push(Math.floor(d/1e3));el.innerHTML='<div class="count">'+x.map((v,i)=>`<div class="box"><b>${String(v).padStart(2,'0')}</b><span>${['يوم','ساعة','دقيقة','ثانية'][i]}</span></div>`).join('')+'</div>'}t();setInterval(t,1000)}
async function portal(){try{let j=await api('/api/portal/'+$('code').value.trim());$('login').style.display='none';$('portalView').style.display='block';$('mode').textContent='بوابة الطالب / ولي الأمر';let g=j.grades;let ex=j.exams.map((e,i)=>{let id='c'+i;setTimeout(()=>countdown($(id),new Date(e.date+'T'+(e.time||'00:00')+':00').getTime()),0);return `<div class="exam"><div>${e.date} ${e.time||''}</div><h2>${e.type} — اللغة الإنجليزية</h2><div id="${id}"></div></div>`}).join('');let no=j.notices.map(n=>`<div class="notice"><b>${n.type}</b><h3>${n.title}</h3><p>${n.body}</p></div>`).join('')||'<p>لا توجد تبليغات.</p>';const annualClass = g.annual == null ? 'annual-equal' : Number(g.annual) > 50 ? 'annual-pass' : Number(g.annual) < 50 ? 'annual-fail' : 'annual-equal';
const gradeCard=(label,value,cls)=>`<div class="grade-card ${cls}"><div class="label">${label}</div><div class="value">${value??'—'}</div></div>`;
$('portalView').innerHTML=`<div class="panel"><h1>${j.student.name}</h1><p>الصف: <b>${j.student.class_name}</b></p><h2>📅 مواعيد الامتحانات</h2>${ex||'<p>لا توجد مواعيد.</p>'}<h2>📢 التبليغات</h2>${no}<h2>📊 الدرجات</h2><div class="grade-cards">${gradeCard('ش1 ف1',g.m1_t1,'monthly')}${gradeCard('ش2 ف1',g.m2_t1,'monthly')}${gradeCard('سعي ف1',g.f1,'semester')}${gradeCard('نصف السنة',g.midyear,'midyear')}${gradeCard('ش1 ف2',g.m1_t2,'monthly')}${gradeCard('ش2 ف2',g.m2_t2,'monthly')}${gradeCard('سعي ف2',g.f2,'semester')}${gradeCard('السعي السنوي',g.annual,annualClass)}</div><h2>📝 الحضور</h2>${j.attendance.map(a=>`<p>${a.date}: <b>${a.status}</b></p>`).join('')||'<p>لا توجد سجلات.</p>'}<div class="notice">🔒 مشاهدة فقط — لا يمكن للطالب أو ولي الأمر تعديل أي بيانات.</div></div>`}catch(e){alert(e.message)}}
async function loadAll(){loadStudents();loadGrades();loadAtt();loadExams();loadNotices();$('ad').value=new Date().toISOString().slice(0,10)}
</script></body></html>
